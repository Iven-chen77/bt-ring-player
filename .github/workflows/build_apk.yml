# ============================================================
# GitHub Actions 云端构建 APK —— 免 WSL / 免虚拟机 / 零本地环境
# 使用：把项目推到 GitHub 公开仓库 → Actions → Run workflow → 下载 APK
# ============================================================
name: Build BTRingPlayer APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'build_apk.log'
      - 'venv/**'
      - '.venv/**'
  workflow_dispatch:   # 允许在 Actions 页面手动点击 "Run workflow" 触发

# 全局环境变量
env:
  PIP_INDEX_URL: "https://pypi.tuna.tsinghua.edu.cn/simple"
  PIP_TRUSTED_HOST: "pypi.tuna.tsinghua.edu.cn"
  BUILDOZER_INTERACTIVE: "0"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:

      # -------- Step 1: 检出项目代码 --------
      - name: Checkout source code
        uses: actions/checkout@v4

      # -------- Step 1.5: 构建前强制修复 buildozer.spec（双重保险）--------
      # 无论 GitHub 上的 spec 是否同步成功，这里用 sed 强制：
      #   1) android.archs 改为单架构 arm64-v8a（避免路径空格 + OOM）
      #   2) 删除不存在的 android.storage_dir 配置项（buildozer 不识别）
      - name: Pre-flight fix buildozer.spec
        run: |
          echo "Before fix:"
          grep -E '^android.(archs|storage_dir)' buildozer.spec || true
          sed -i '/^android\.storage_dir/d' buildozer.spec
          sed -i -E 's|^android\.archs\s*=.*$|android.archs = arm64-v8a|' buildozer.spec
          echo "After fix:"
          grep -E '^android.(archs|storage_dir)' buildozer.spec || true

      # -------- Step 2: 安装系统依赖（Java + Buildozer 编译依赖）--------
      - name: Install system dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq --no-install-recommends \
            openjdk-17-jdk \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libffi-dev libssl-dev automake \
            cmake \
            python3-pip python3-dev python3-setuptools python3-wheel \
            libncurses-dev libtinfo6
          java -version
          python3 --version

      # -------- Step 3: 缓存 pip / buildozer 全局缓存（加速下一次构建）--------
      - name: Cache pip & buildozer global dir
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.buildozer
            ~/.gradle
          key: buildozer-cache-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'requirements.txt') }}
          restore-keys: |
            buildozer-cache-v2-${{ runner.os }}-
            buildozer-cache-v1-${{ runner.os }}-

      # -------- Step 4: 安装 Python 构建工具 --------
      - name: Install buildozer / cython
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install cython buildozer plyvel

      # -------- Step 5: 打印环境（调试用）--------
      - name: Print tool versions
        run: |
          python3 -m buildozer --version
          python3 -c "import Cython; print('Cython', Cython.__version__)"
          python3 -c "import buildozer; print('buildozer at:', buildozer.__file__)"
          echo "JAVA_HOME = $JAVA_HOME"
          echo "PWD = $(pwd)"
          ls -la

      # -------- Step 6: 核心：执行 buildozer 构建 debug APK --------
      # 最佳努力创建 swap（防止 OOM）：失败不阻塞；用 dd 代替 fallocate（更兼容）
      - name: Build APK with Buildozer (debug)
        run: |
          echo "Trying to create 4GB swap (best effort, skip on failure)..."
          sudo swapoff /tmp/swapfile 2>/dev/null || true
          sudo rm -f /tmp/swapfile 2>/dev/null || true
          if sudo dd if=/dev/zero of=/tmp/swapfile bs=1M count=4096 status=none 2>/dev/null; then
            sudo chmod 600 /tmp/swapfile
            sudo mkswap /tmp/swapfile 2>/dev/null
            sudo swapon /tmp/swapfile 2>/dev/null && echo "Swap enabled OK" || echo "Swap enable skipped (non-fatal)"
          else
            echo "Swap create skipped (non-fatal, continuing build)"
          fi
          free -h
          echo "Start building APK. First run downloads SDK/NDK, be patient..."
          BUILDOZER_HOME="${{ github.workspace }}/.buildozer_cache" \
          python3 -m buildozer -v android debug 2>&1 | tee build_apk.log
        env:
          BUILDOZER_INTERACTIVE: "0"
        shell: bash

      # -------- Step 7: 上传构建日志（失败时方便排查）--------
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_apk.log
          if-no-files-found: ignore
          retention-days: 14

      # -------- Step 8: 找到 APK + 上传产物（核心交付物！）--------
      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BT-RingPlayer-APK
          path: |
            bin/*.apk
          if-no-files-found: error
          retention-days: 90
